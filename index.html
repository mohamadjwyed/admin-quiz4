<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر تشريعات التعاون — إيوان التعليمي</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#ffffff; --ink:#2b2620; --muted:#6b6255;
    --brand:#7a5c3e; --brand-dark:#513d29; --accent:#b08b5a;
    --good:#3f7d5c; --good-bg:#eaf5ee; --bad:#b3503f; --bad-bg:#fbeae7;
    --trap-bg:#fff6e6; --trap-border:#e0b45a;
    --ex-bg:#eef3f6; --ex-border:#7a9cae;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.8;
  }
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 60px}
  header.hero{
    text-align:center; padding:28px 18px 22px; background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    color:#fff; border-radius:0 0 22px 22px; margin-bottom:18px;
  }
  header.hero .bismillah{font-size:1.05rem; opacity:.92; margin-bottom:6px}
  header.hero h1{margin:6px 0 4px; font-size:1.5rem}
  header.hero p{margin:2px 0; opacity:.9; font-size:.95rem}
  header.hero a.wa{
    display:inline-block; margin-top:14px; background:#25d366; color:#fff; text-decoration:none;
    padding:9px 18px; border-radius:24px; font-weight:600; font-size:.9rem; box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  nav.tabs{
    display:flex; gap:8px; position:sticky; top:0; background:var(--bg); z-index:20; padding:8px 0 12px;
  }
  nav.tabs button{
    flex:1; padding:12px 8px; border:none; border-radius:12px; background:#eee3d3; color:var(--brand-dark);
    font-weight:700; font-size:.95rem; cursor:pointer; transition:.2s;
  }
  nav.tabs button.active{background:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(122,92,62,.35)}

  section{display:none}
  section.active{display:block}

  /* ===== Explanation section ===== */
  .unit{
    background:var(--card); border-radius:16px; padding:18px 18px 16px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.05); border-inline-start:5px solid var(--brand);
  }
  .unit h3{margin:0 0 10px; color:var(--brand-dark); font-size:1.1rem}
  .unit ul{margin:0 0 12px; padding-inline-start:20px}
  .unit li{margin-bottom:7px; font-size:.95rem}
  .tag{
    display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; font-size:.88rem; margin-top:8px;
  }
  .tag.trap{background:var(--trap-bg); border:1px solid var(--trap-border)}
  .tag.example{background:var(--ex-bg); border:1px solid var(--ex-border)}
  .tag b{white-space:nowrap}

  /* ===== Quiz section ===== */
  .quiz-top{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  .progress-wrap{flex:1; min-width:150px; background:#e6ddc9; border-radius:20px; height:10px; overflow:hidden}
  .progress-bar{height:100%; background:var(--brand); width:0%; transition:.3s}
  .score-badge{
    background:var(--card); border-radius:12px; padding:6px 14px; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .qcount{font-size:.82rem; color:var(--muted)}

  .qcard{
    background:var(--card); border-radius:18px; padding:20px; box-shadow:0 3px 14px rgba(0,0,0,.07); margin-bottom:16px;
  }
  .qcard h4{margin:0 0 16px; font-size:1.05rem; color:var(--brand-dark); line-height:1.7}
  .opt{
    display:block; width:100%; text-align:right; background:#faf8f3; border:2px solid #e6ddc9; border-radius:12px;
    padding:12px 14px; margin-bottom:10px; font-size:.93rem; cursor:pointer; transition:.15s; color:var(--ink);
  }
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:var(--good-bg); border-color:var(--good); color:#1f4a34; font-weight:700}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:#7a3226; font-weight:700}
  .opt.disabled{cursor:default; pointer-events:none}
  .opt.dim{opacity:.55}

  .cards4{display:none; margin-top:16px; gap:10px; flex-direction:column}
  .cards4.show{display:flex}
  .minicard{border-radius:12px; padding:12px 14px; font-size:.88rem}
  .minicard .lbl{font-weight:800; font-size:.78rem; margin-bottom:4px; display:block}
  .mc-legal{background:#f1ece1; border-inline-start:4px solid var(--brand)}
  .mc-simple{background:#eef3f6; border-inline-start:4px solid var(--ex-border)}
  .mc-example{background:#eaf5ee; border-inline-start:4px solid var(--good)}
  .mc-trap{background:var(--trap-bg); border-inline-start:4px solid var(--trap-border)}

  .nextbtn{
    display:none; margin-top:16px; width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--brand); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer;
  }
  .nextbtn.show{display:block}

  .result{
    text-align:center; background:var(--card); border-radius:18px; padding:32px 20px; box-shadow:0 3px 14px rgba(0,0,0,.08);
  }
  .result h2{color:var(--brand-dark); margin-top:0}
  .result .big{font-size:2.6rem; font-weight:800; color:var(--brand); margin:10px 0}
  .restartbtn{
    margin-top:16px; padding:12px 24px; border:none; border-radius:12px; background:var(--brand);
    color:#fff; font-weight:700; cursor:pointer; font-size:.95rem;
  }

  footer{text-align:center; margin-top:30px; padding-top:18px; border-top:1px solid #e0d7c4; color:var(--muted); font-size:.85rem}
  footer b{color:var(--brand-dark)}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="bismillah">بسم الله نبدأ</div>
    <h1>📘 دفتر تشريعات التعاون</h1>
    <p>تطبيق إيوان التعليمي — يتمنى لكم التوفيق والنجاح</p>
    <a class="wa" href="https://chat.whatsapp.com/FKynKa5tMAiEGP6JRJ2F26?s=cl&p=a&mlu=4&ilr=4" target="_blank">💬 انضم لمجموعة الواتساب</a>
  </header>

  <nav class="tabs">
    <button id="tab-study" class="active" onclick="showTab('study')">📖 قسم الشرح</button>
    <button id="tab-quiz" onclick="showTab('quiz')">📝 الاختبار التفاعلي (١٠٠ سؤال)</button>
  </nav>

  <section id="study" class="active"></section>

  <section id="quiz">
    <div class="quiz-top">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="qcount" id="qcount">سؤال ١ من ١٠٠</div>
      <div class="score-badge">✅ <span id="scoreNum">0</span></div>
    </div>
    <div id="quizArea"></div>
  </section>

  <footer>
    إعداد <b>خالد الحمد</b>
  </footer>
</div>

<script>
const DATA = {"units": [{"title": "الوحدة ١ — تعريف التعاون ومفهومه", "points": ["لغةً: التعاون يعني العمل معًا ومساعدة الآخرين.", "اصطلاحًا: تطوّر المفهوم ليصبح تنظيمًا اختياريًا قائمًا على أسس ديمقراطية بين أفراد تربطهم مصلحة مشتركة، بغرض تحقيق مشاريع مشتركة."], "trap": "لا تكتفِ بتعريف \"مساعدة الآخرين\" في الامتحان — المطلوب التعريف الاصطلاحي الكامل: تنظيم اختياري + أسس ديمقراطية + مصلحة مشتركة + مشاريع مشتركة.", "example": "جمعية تعاونية استهلاكية في القامشلي يجتمع فيها موظفون لشراء المواد الغذائية بسعر الجملة بدلًا من شرائها فرديًا من التجار — هذا هو جوهر «المصلحة المشتركة»."}, {"title": "الوحدة ٢ — أقسام الجمعيات التعاونية حسب الغرض", "points": ["الجمعية الاستهلاكية: يُنشئها المستهلكون للحصول على السلع بسعر التكلفة دون تحقيق ربح، وتوزَّع الفروقات (العائد) حسب نسبة مشتريات كل عضو.", "الجمعية الخدمية: تشمل أنواعًا متعددة بحسب الخدمة: سكن، تأمين، نقل واتصالات، خدمات صحية، كهرباء، خدمات مدرسية.", "الجمعية الإنتاجية: مجموعة عمال يزاولون الإنتاج بأنفسهم؛ الربح والخسارة يتحملها جميع الأعضاء، وتنشأ غالبًا في الصناعات الخفيفة قليلة التكلفة.", "الجمعية الحرفية: تجمع أصحاب حرفة واحدة لتحسين وضعهم الإنتاجي والربحي.", "الجمعية الزراعية: تجمع الفلاحين لشراء المستلزمات الزراعية (بذار، سماد) جملة، ثم توزيع الربح على الأعضاء."], "trap": "لا تخلط بين «الاستهلاكية» (بيع بسعر التكلفة دون ربح) و«الإنتاجية» (العمال أنفسهم ينتجون ويتحملون الربح والخسارة) — سؤال شائع يعكس التعريفين.", "example": "جمعية تعاونية سكنية خدمية تؤمّن السكن فقط لأعضائها بمنطقة الحسكة، مقابل جمعية إنتاجية يشترك فيها حرفيون لصناعة الأثاث ويقتسمون الربح والخسارة."}, {"title": "الوحدة ٣ — روبرت أوين ورائد الفكر التعاوني في إنكلترا", "points": ["طبّق أفكاره في مصانع نيولانارك: خفّض ساعات العمل من ١٧ إلى ١٠ ساعات، منع تشغيل الأطفال دون سن العاشرة، أنشأ صندوق ضمان صحي ومساكن بأسعار معقولة، ومحلًا يبيع مستلزمات الحياة بسعر التكلفة.", "دُعي إلى روسيا عام ١٨١٥ لتأسيس مشروعات مماثلة.", "أسس عام ١٨٢٥ مستعمرة «هارموني الجديدة» في الولايات المتحدة لتطبيق مجتمع تعاوني متكامل قائم على الملكية الجماعية — فشلت عام ١٨٢٧ بسبب عدم تكيّف الأعضاء واختلافهم في الدين والسياسة.", "حاول إلغاء الربح عبر إلغاء النقود الورقية واعتماد «بطاقات العمل» (تُصرف حسب عدد ساعات العمل)، وأسّس «محل التبادل العادل للعمل» — أُغلق بعد سنتين فقط بسبب الفشل."], "trap": "أسباب فشل بطاقات العمل أربعة: (أ) سوء تقدير قيمة السلعة (ساعات مبالغ فيها) (ب) عدم مراعاة نوعية السلعة (ج) استغلال التجار للبطاقات لشراء أفضل السلع وإعادة بيعها بربح (د) استغلال المضاربين ببضائع رديئة. لا تختصرها بسبب واحد.", "example": "يشبه هذا في سياقنا محاولة أي جمعية تعاونية تسعير الخدمات بساعات العمل فقط دون اعتبار الجودة — ستفشل لنفس أسباب أوين بالضبط."}, {"title": "الوحدة ٤ — رواد روتشدال (١٧٧١–١٨٥٨) وتأسيس المبادئ الحديثة", "points": ["نشأت الجمعية نتيجة جشع التجار وبيعهم السلع بأسعار مرتفعة وبالنسيئة، فاجتمع ٢٨ شخصًا في إنكلترا وأسسوا جمعية استهلاكية عام ١٨٤٤.", "أهم مبادئها: البيع بسعر السوق (لا بسعر التكلفة) لتجنب مجابهة التجار، وإعادة الربح للأعضاء حسب مشترياتهم لا حسب عدد الأسهم؛ عضوية مفتوحة دون تحديد عدد؛ صوت واحد لكل عضو مهما بلغت أسهمه؛ منع البيع بالنسيئة؛ فائدة محددة على الأسهم لا تتجاوز ٥٪؛ تخصيص ٢٫٥٪ من الأرباح للأغراض الاجتماعية والثقافية؛ اجتماعات دورية.", "وليم كنج أسّس أول محل تعاوني في برايتون عام ١٨٢٧ — تجربة أنجح من أوين لأنها اعتمدت رأس مال حقيقي وسمحت بالربح من بيع السلع لغير الأعضاء."], "trap": "مبادئ روتشدال هي أساس مبادئ حلف التعاون الدولي لاحقًا (١٩٩٥) — سؤال شائع يربط بينهما. أيضًا: الفائدة على الأسهم بروتشدال محددة بحد أقصى ٥٪ — نفس الرقم يتكرر لاحقًا في قانون التعاون السوري (٦٪ في نص آخر من النوطة عن الجمعيات الاستهلاكية) فانتبه للفرق بين المصدرين عند السؤال.", "example": "جمعية استهلاكية سورية تبيع بسعر السوق ثم تعيد للأعضاء «العائد» نهاية العام حسب مشترياتهم الفعلية — تطبيق حرفي لمبدأ روتشدال."}, {"title": "الوحدة ٥ — لويس بلان وفكرة الورشات الاجتماعية (فرنسا)", "points": ["اتجه نحو الجانب التعاوني الإنتاجي، ونشر أفكاره في مقالات بمجلة التقدم الفرنسية.", "رأى أن حل مشكلات العمال يكون عبر تدخّل الدولة لبناء «ورشات اجتماعية» يجتمع فيها عمال الحرفة الواحدة.", "اقترح تقسيم دخل الورشة إلى ثلاثة أجزاء: (١) للعمال بالتساوي (٢) لصندوق تضامن اجتماعي يعين المرضى والعجزة (٣) لتوسيع الورشة وشراء آلات جديدة."], "trap": "بلان اعتمد على تدخل الدولة، بعكس أوين وفوريه اللذين اعتمدا على المبادرة الذاتية للمستعمرات المكتفية ذاتيًا — نقطة تمييز أساسية بين الروّاد الثلاثة.", "example": "يشبه اقتراح بلان فكرة إنشاء صندوق تضامن اجتماعي داخل نقابة مهنية يموَّل من دخل جماعي لدعم الأعضاء المرضى — نفس المنطق."}, {"title": "الوحدة ٦ — شارل فوريه والمستعمرة التعاونية «فالانستير» (فرنسا)", "points": ["أفكاره مختلطة: جمعت بين الطابع الإنتاجي والاستهلاكي معًا.", "انتقد النظام الصناعي وإفقار العامل، وهاجم التجار المستغلّين.", "اقترح إنشاء جماعات متكاملة (كتانات) تعيش في مستعمرة زراعية تعاونية اسمها «فالانستير»، يتراوح عدد أفرادها بين ١٩٠٠ و٢٠٠٠ شخص (نصفهم رجال ونصفهم نساء).", "اقترح توزيع الناتج الجماعي وفق النسب: ١٢٫٥ للعمال، ١٢٫٤ لصاحب رأس المال، ١٢٫٣ للعمل الذهني/المهارة."], "trap": "نسب التوزيع عند فوريه (١٢٫٥ / ١٢٫٤ / ١٢٫٣) قد تُطرح بترتيب مختلط في الاختيارات لاختبار الحفظ الدقيق — العمل أولًا، ثم رأس المال، ثم المهارة الذهنية.", "example": "أندريه غودان طبّق فكرة قريبة عمليًا في فرنسا: حوّل مصنعه الخاص لصناعة التدفئة إلى جمعية تعاونية عمالية، وبعد وفاته آلت ملكيته للعمال باسم «المصنع العائلي»."}, {"title": "الوحدة ٧ — شولتز-ديلنش وريفايزن (ألمانيا) — التعاون الائتماني", "points": ["شولتز ديلنش (١٨٠٠–١٨٨٣): أسّس النظام المالي التعاوني، ومصارفه تقتصر عضويتها على صغار الصناع والتجار، ولا تقبل مساعدات مالية من الدولة أو الأغنياء.", "مبادئ مصارف شولتز: رسم اشتراك بسيط + حصة في رأس المال، مسؤولية محدودة بقدر الحصة، الاقتصار على العمليات المصرفية دون التجارية، قروض قصيرة الأجل (لا تتجاوز ٣ أشهر)، إدارة بموظفين مختصين بأجر، توزيع جزء من الأرباح كفائدة.", "ريفايزن: مصارف تعاونية زراعية نشأت بسبب ارتفاع فوائد المرابين على المزارعين. مبادئها: قبول مساعدات الدولة والأغنياء، نشاط محصور بمنطقة واحدة (معرفة متبادلة)، أسهم رمزية غير محدودة، مسؤولية غير محدودة، قروض طويلة الأجل تناسب المواسم الزراعية، عدم توزيع الأرباح (تُوجَّه للاحتياطي)، احتياطي غير قابل للتجزئة أو التصفية."], "trap": "مصارف شولتز ≠ مصارف ريفايزن في كل نقطة تقريبًا: شولتز يرفض مساعدة الدولة وريفايزن يقبلها؛ شولتز مسؤولية محدودة وريفايزن غير محدودة؛ شولتز قروض قصيرة وريفايزن قروض طويلة؛ شولتز يوزّع أرباحًا وريفايزن لا يوزّعها. هذا التقابل من أكثر الأسئلة تكرارًا.", "example": "مصرف ريفايزن أشبه بصندوق تعاوني زراعي محلي يقرض فلاحي قرية واحدة فقط بفائدة منخفضة وبفترة سداد تمتد لموسم زراعي كامل، بعكس مصرف تجاري تقليدي."}, {"title": "الوحدة ٨ — حلف التعاون الدولي والمبادئ السبعة (١٩٩٥)", "points": ["تأسس في لندن عام ١٨٩٥ لرعاية الحركة التعاونية دوليًا، معتمدًا على مبادئ روتشدال.", "منذ ١٩٤٦ بدأ إرسال ممثلين إلى المجلس الاقتصادي والاجتماعي للأمم المتحدة (بصفة استشارية دون تصويت).", "أصدر مبادئ التعاون عام ١٩٣٤ مقسّمة إلى مبادئ أساسية وثانوية، ثم أقرّ سبعة مبادئ نهائية عام ١٩٩٥ اعتمدتها منظمة العمل الدولية بالتوصية رقم ١٩٣ لعام ٢٠٠٢.", "المبادئ السبعة: (١) العضوية الطوعية والمفتوحة للجميع (٢) الرقابة الديمقراطية من الأعضاء (٣) المشاركة الاقتصادية للأعضاء (٤) الاستقلالية والاستقلال الذاتي للجمعية (٥) التعليم والتدريب والمعلومات (٦) التعاون بين التعاونيات (٧) الاهتمام بشؤون المجتمع."], "trap": "لا يجوز إجبار أي شخص على الانتساب إلى جمعية تعاونية وفق مبادئ ١٩٩٥ — لكن سوريا استثنت هذا المبدأ عمليًا بإلزام المستفيدين من أراضي الإصلاح الزراعي بالانتساب إلى الجمعية الزراعية. هذا تناقض ظاهري يُختبر كثيرًا.", "example": "في سوريا، فرضت الدولة على الفلاحين المستفيدين من توزيع أراضي الإصلاح الزراعي الانتساب الإجباري إلى الجمعية التعاونية الزراعية — استثناء صريح من مبدأ الطوعية الدولي."}, {"title": "الوحدة ٩ — رأس المال، الأسهم، والعائد", "points": ["السهم في الجمعية التعاونية: اسمي (لا لحامله)، قيمته ثابتة لا تتغير، غير قابل للمضاربة أو التداول — بعكس أسهم شركات المساهمة القابلة للتداول والمضاربة.", "العنصر الإنساني مقدَّم على المالي: صوت واحد لكل عضو بغض النظر عن عدد الأسهم.", "الفائدة على الأسهم محدودة (لا تزيد عن نسبة معينة من الأرباح) ولا توزَّع إذا لم تحقق الجمعية ربحًا.", "العائد: ما تدفعه الجمعية للعضو من الأرباح حسب حجم تعامله معها (مشترياته/إنتاجه) لا حسب عدد أسهمه."], "trap": "لا تخلط بين «الفائدة على السهم» (نسبة ثابتة قليلة على رأس المال المدفوع) و«العائد» (حصة من الربح حسب التعامل الفعلي مع الجمعية) — هما مفهومان مختلفان يُختبران بأسئلة تمييزية.", "example": "عضو جمعية استهلاكية اشترى سلعًا بقيمة كبيرة خلال السنة يحصل على عائد أكبر من عضو آخر يملك أسهمًا أكثر لكنه لم يتعامل مع الجمعية إطلاقًا — لأن العائد مبني على التعامل لا على الملكية."}, {"title": "الوحدة ١٠ — المال الاحتياطي", "points": ["يُعدّ أكثر أهمية من رأس المال لأنه من الموجودات الأكيدة، غير قابل للتصفية أو التوزيع على الأعضاء، ولا تُدفع عنه فوائد.", "نوعان: احتياطي قانوني إجباري، واحتياطي اختياري (يُترك تكوينه لتقدير كل جمعية).", "قانون التعاون رقم ٣١٧ (المادة ٣٩): اقتطاع ٢٠٪ على الأقل من صافي الأرباح سنويًا، حتى يبلغ الاحتياطي ربع رأس المال المسهم والمدفوع، على ألا تتجاوز نسبة الاقتطاع لهذا الغرض ٤٠٪ من أرباح السنة الجارية."], "trap": "رقمان يتكرران معًا ويُخلط بينهما: ٢٠٪ (الحد الأدنى السنوي للاقتطاع) و٤٠٪ (السقف الأقصى للاقتطاع)، والهدف النهائي هو الوصول إلى ربع رأس المال (٢٥٪) — احفظ الثلاثة أرقام مرتبطة ببعضها لا منفردة.", "example": "جمعية استهلاكية حققت ربحًا صافيًا، يجب أن تقتطع منه ٢٠٪ على الأقل سنويًا لصالح الاحتياطي القانوني إلى أن يصل إلى ربع رأس مالها المدفوع."}, {"title": "الوحدة ١١ — تأسيس الجمعية الاستهلاكية (قانون ٣١٧ لعام ١٩٥٨)", "points": ["صدر أصلًا كقانون مصري رقم ٣١٧ عام ١٩٥٦، وطُبّق في سوريا بموجب القرار رقم ٩١ لعام ١٩٥٨ إبان الوحدة مع مصر (قانون عام للتعاون + قانون خاص بالاستهلاكية).", "الحد الأدنى لعدد المؤسسين: عشرة أعضاء — نقص العدد عن عشرة يؤدي إلى انقضاء الجمعية.", "بيانات عقد التأسيس الإلزامية: اسم الجمعية، الغرض، المقر، الأعضاء المؤسسون، رأس المال.", "شروط اسم الجمعية: يحتوي لفظ «استهلاكية»، يحدد دائرة عمل الجمعية، لا يحتوي اسم فرد أو شخص من الغير، غير مكرر مع جمعية أخرى.", "قيمة السهم في سوريا ثابتة، ولا يجوز أن تتجاوز عشر ليرات سورية، وعدد الأسهم غير محدد (قابل للزيادة والنقصان) بعكس شركات المساهمة."], "trap": "قيمة السهم القصوى «عشر ليرات سورية» رقم تاريخي مرتبط بزمن صدور القانون — يُطرح غالبًا كخيار مع أرقام أخرى (٥، ١٥، ٢٠) لاختبار الدقة.", "example": "عند تأسيس جمعية استهلاكية في محافظة الحسكة، يجب أن يجتمع عشرة مؤسسين على الأقل، ويوقّعوا عقد تأسيس يحدد اسمًا يحتوي كلمة «استهلاكية» ومنطقة عمل الجمعية بوضوح."}, {"title": "الوحدة ١٢ — الجمعية العمومية وأنواعها", "points": ["ثلاثة أنواع: الجمعية العمومية التأسيسية (الأولى)، العادية (السنوية)، الاستثنائية.", "تُعقد الجمعية العادية السنوية خلال الأشهر الأربعة التالية لانتهاء السنة المالية بدعوة من مجلس الإدارة.", "مهامها: التصديق على الحسابات وتقارير مجلس الإدارة، انتخاب أعضاء مجلس الإدارة، توزيع الفوائد والعوائد، دراسة الشكاوى، اختيار مراجع الحسابات، التصديق على برنامج النشاط السنوي.", "النصاب: الاجتماع الأول قانوني بحضور الأغلبية المطلقة (٥١٪) من الأعضاء المساهمين والمكتتبين؛ وإن لم يكتمل، يُعقد اجتماع ثانٍ بحضور ما لا يقل عن ثلاثين مساهمًا + أعضاء اللجنة المؤقتة.", "الدعوة تُبلَّغ خطيًا (مباشرة أو رسالة مسجلة)، وتُنشر في الصحف، وتُلصق على لوحة إعلانات الجمعية قبل الموعد بخمسة عشر يومًا."], "trap": "لا تخلط نصاب الاجتماع الأول (٥١٪ أغلبية مطلقة) بنصاب الاجتماع الثاني (٣٠ مساهمًا فقط + اللجنة المؤقتة) — هذا التفصيل يُختبر بكثرة لأنه يبدو متشابهًا.", "example": "إذا لم يحضر ٥١٪ من أعضاء جمعية تعاونية في الاجتماع الأول، يُؤجَّل الاجتماع وتُعقد جلسة ثانية يكفي فيها حضور ٣٠ مساهمًا فقط لصحة الانعقاد."}, {"title": "الوحدة ١٣ — مجلس الإدارة: التشكيل والشروط والصلاحيات", "points": ["الحد الأدنى ثلاثة أعضاء (قانون ٣١٧)، ينتخبهم الأعضاء بالاقتراع السري، لمدة لا تتجاوز ثلاث سنوات قابلة للتجديد، ولا يوجد حد أقصى لعددهم في القانون العام.", "النظام الموحد للتعاونيات الاستهلاكية (المعدَّل بالقرار الوزاري ٢٧١ لعام ١٩٩٧): ٧ أعضاء إذا تجاوز عدد المساهمين ١٥٠٠ مساهم، و٥ أعضاء لبقية المجالس.", "شروط العضوية: سوري الجنسية (أو في حكمه كالفلسطينيين)، متمتع بحقوقه المدنية والسياسية، مقيم في منطقة عمل الجمعية، غير محكوم بجنحة مخلة بالشرف، بريء الذمة تجاه الجمعية، عضو منذ سنة على الأقل (باستثناء المجلس الأول)، غير عامل بأجر لدى الجمعية، غير متعاقد معها بمصلحة (مورد/مقاول).", "أسباب سقوط العضوية: تخلف الشروط، طلب إعفاء مقبول، غياب ثلاث جلسات متتالية دون عذر، قرار إسقاط من الهيئة العامة بناء على تقرير تقصير.", "المجلس هو الجهاز التنفيذي: يبرم العقود باسم الجمعية (بصفة وكيل عنها)، وتصرفاته خارج حدود اختصاصه لا تُلزم الجمعية بل تكون مسؤوليته شخصية."], "trap": "«لا يقل عن ثلاثة أعضاء» هو نص القانون العام ٣١٧، بينما «٥ أو ٧ أعضاء» هو تفصيل النظام الموحد المعدَّل لاحقًا حسب عدد المساهمين — لا تكتب رقمًا واحدًا فقط كإجابة نهائية دون تحديد المصدر.", "example": "جمعية استهلاكية في محافظة كبيرة يتجاوز مساهموها ١٥٠٠ عضو يجب أن يتألف مجلس إدارتها من ٧ أعضاء وفق النظام الموحد، لا ٥ فقط."}, {"title": "الوحدة ١٤ — المسؤولية المدنية والعقوبات", "points": ["أنواع المسؤولية المدنية لأعضاء الجمعية: (١) محدودة — الأصل، بقيمة الأسهم (٢) مضاعفة — بضعف أو ثلاثة/أربعة أمثال قيمة الأسهم (٣) غير محدودة (تضامنية) — الأعضاء مسؤولون بالتضامن عن كل التزامات الجمعية.", "المسؤولية التضامنية تعزز ثقة الغير بالجمعية، ويمكن للدائن مطالبة أي عضو بكامل الدين ولو ملك سهمًا واحدًا، مع حق رجوعه على باقي الأعضاء.", "المادة ٧٨ من قانون التعاون ٣١٧: الحبس مدة لا تزيد عن ستة أشهر وغرامة لا تتجاوز ألف ليرة سورية (أو إحدى العقوبتين) على المؤسسين وأعضاء المجلس والمديرين والمصفين ومراجعي الحسابات عند التزوير أو إخفاء الوقائع.", "المادة ٧٩: غرامة لا تتجاوز خمسة آلاف ليرة سورية على مخالفات مالية إدارية أخرى.", "المادة ٨١: غرامة لا تتجاوز ألف ليرة سورية على كل شخص ينشر تقارير غير صحيحة عن حالة الجمعية المالية أو الإدارية."], "trap": "المسؤولية المحدودة هي الأصل، والمضاعفة والتضامنية استثناء يُنص عليه صراحة في النظام الداخلي — لا تفترض أن كل جمعية تعاونية أعضاؤها مسؤولون بالتضامن.", "example": "إذا أخفى عضو مجلس إدارة جمعية تعاونية بيانات مالية كاذبة عن حالة الجمعية، يخضع لعقوبة الحبس والغرامة المنصوص عليها في المادة ٧٨."}, {"title": "الوحدة ١٥ — الانقضاء، الحل، التصفية، والاندماج", "points": ["الانقضاء: زوال الجمعية تلقائيًا لزوال سبب وجودها (كنقص عدد المؤسسين عن الحد الأدنى)، بينما الحل يكون بقرار إداري أو قضائي أو اختياري صريح.", "الحل القضائي: بحكم من محكمة البداية المدنية في حالات: اشتغال الجمعية بالسياسة، تعذّر مواصلة عملها بانتظام (تكرار الإخلال بالمبادئ)، تكرار الإخلال بالالتزامات — الأمر متروك للسلطة التقديرية للمحكمة.", "التصفية: تبدأ بتعيين مصفّين من الجهة التي أصدرت قرار الحل (الوزير أو الجمعية العمومية أو المحكمة)، ويخضعون لرقابة وزارة التجارة الداخلية وحماية المستهلك التي يحق لها عزلهم.", "الاندماج: تتوحد جمعية أو أكثر في جمعية جديدة تنقضي الجمعيات المندمجة وتنتقل أموالها وشخصيتها الاعتبارية إليها."], "trap": "الانقضاء لا يحتاج تدخلًا إداريًا (يحدث تلقائيًا بزوال السبب)، لكن يجب أن يصدر قرار رسمي من الوزارة يقر هذا الانقضاء شكلًا لا موضوعًا — تناقض ظاهري بين «التلقائية» و«ضرورة القرار» يُختبر كثيرًا.", "example": "جمعية تعاونية زراعية انخفض عدد أعضائها عن الحد الأدنى القانوني (١٠) تنقضي تلقائيًا، لكن وزارة التجارة الداخلية تصدر لاحقًا قرارًا رسميًا يقر هذا الانقضاء إداريًا."}, {"title": "الوحدة ١٦ — الاتحادات التعاونية (إقليمي، نوعي، عام)", "points": ["ثلاثة أنواع من الاتحادات: إقليمي (جمعيات محافظة واحدة)، نوعي (جمعيات من نفس النوع في القطر)، عام (يضم كل الاتحادات الإقليمية والنوعية على مستوى الجمهورية، مقره دمشق).", "الاتحاد التعاوني الاستهلاكي المركزي يتألف من الجمعيات الاستهلاكية في عموم سوريا، ويديره مجلس من رؤساء الاتحادات الإقليمية في المحافظات.", "موارد الاتحاد المركزي: اشتراكات الجمعيات الأعضاء، فائض تصفية الجمعيات، الهبات والوصايا، إعانات الحكومة.", "مهامه: اقتراح السياسة العامة للتعاون الاستهلاكي، إعداد الإحصاءات، نشر الثقافة التعاونية، المشورة الفنية والقانونية، تولي تصفية الجمعيات المنحلّة."], "trap": "لا يجوز تكوين أكثر من اتحاد إقليمي واحد في المحافظة الواحدة، ولا أكثر من اتحاد نوعي واحد على مستوى القطر في مجال النشاط ذاته — وحدة الإقليم ووحدة النشاط شرطان أساسيان.", "example": "الاتحاد التعاوني الاستهلاكي المركزي في دمشق يشرف على جميع الاتحادات الإقليمية للجمعيات الاستهلاكية في المحافظات السورية، بما فيها الحسكة والقامشلي."}, {"title": "الوحدة ١٧ — التعاون السكني (القانون ١٣ لعام ١٩٨١)", "points": ["يهدف إلى شراء الأراضي وتجهيزها بالمرافق وبناء المساكن وتخصيصها للأعضاء عبر جدول أفضلية بحسب أقدمية الانتساب.", "يبقى العضو محتفظًا بأفضليته حتى استلامه المسكن كاملًا، ما لم تُسقط عضويته قانونًا.", "جهات القطاع التعاوني السكني التي تبني مساكن لا تزيد مساحتها الصافية عن ١٣٠ م² تستفيد من مزايا القطاع العام: شراء عقارات بسعر الكلفة، وتخفيض ٢٥٪ من أجور النقل بالسكك الحديدية للمعدات ومواد البناء.", "الاتحاد العام للسكن يتكون من: المؤتمر (السلطة العليا)، مجلس الاتحاد (١٥–٣٥ عضوًا)، المكتب التنفيذي (ينتخبه مجلس الاتحاد لأربع سنوات)."], "trap": "رقم المساحة ١٣٠ م² هو الشرط الحاسم للاستفادة من مزايا القطاع العام — أي مسكن يتجاوزها لا يستفيد من هذه الإعفاءات، وهذا يُطرح غالبًا برقم مقارب (١٢٠ أو ١٥٠) للتمويه.", "example": "جمعية سكنية تعاونية في القامشلي تبني شققًا بمساحة ١٢٠ م² لأعضائها تستفيد من تخفيض ٢٥٪ على أجور نقل مواد البناء بالسكك الحديدية لأنها ضمن الحد المقرر (١٣٠ م²)."}, {"title": "الوحدة ١٨ — الجمعيات الحرفية (المرسوم التشريعي ٢٥٠ لعام ١٩٦٩)", "points": ["شروط الانتساب: أن يكون حرفيًا، عربي الجنسية، أتم الثامنة عشرة، يمارس عمله في منطقة الجمعية، غير منتسب لجمعية حرفية أخرى.", "الرقابة الإدارية تمارسها وزارة الصناعة/مديرية الصناعة، ولها سلطة وقف تنفيذ أي قرار مخالف للقوانين، ويمكن الطعن بقرار الوقف أمام محكمة البداية المدنية.", "الحل الاختياري فقط نص عليه المرسوم: بقرار من ثلثي أعضاء الهيئة العامة، ويُبلَّغ لوزارة الصناعة خلال خمسة عشر يومًا.", "أموال الجمعية المنحلّة تُودَع في مصرف يعينه وزير الصناعة لحين تأسيس جمعية جديدة تؤول إليها الأموال."], "trap": "المرسوم ٢٥٠ حدد الحل الاختياري «فقط» — بخلاف الاستهلاكية التي تتعدد فيها طرق الحل (اختياري/إداري/قضائي). لا تعمّم أنواع الحل على كل أنواع الجمعيات.", "example": "حرفي في القامشلي أتم الثامنة عشرة ويعمل في منطقة الجمعية يمكنه الانتساب لجمعية تعاونية حرفية محلية طالما لم يكن منتسبًا لجمعية أخرى مسبقًا."}, {"title": "الوحدة ١٩ — التنظيم الفلاحي (القانون ٢١ لعام ١٩٧٤)", "points": ["أُسس الاتحاد العام للفلاحين بالمرسوم ١٢٧ لعام ١٩٦٤ كمنظمة نقابية للدفاع عن مصالح الفلاحين، وعُدّل بالمرسوم ٢٥٣ لعام ١٩٦٩.", "القانون ٢١ لعام ١٩٧٤ (التنظيم النقابي الفلاحي، لا يزال نافذًا) دمج التعاونيات الزراعية بالتنظيم النقابي، واستبدل اسم «النقابة الفلاحية» بـ«الجمعية» لتوحيدها في منظمة شعبية-نقابية-اقتصادية واحدة.", "الهيكل التنظيمي: الجمعية الفلاحية (مستوى القرية) ← الرابطة الفلاحية (مستوى المنطقة) ← اتحاد فلاحي المحافظة ← الاتحاد العام للفلاحين (مستوى القطر، مقره دمشق).", "الفلاح حسب القانون: كل من يعمل بالأرض بنفسه أو بأسرته أو بالمشاركة أو بالبدل، والعمال الزراعيون، والملاك الصغار الذين لا تتجاوز ملكيتهم ضعف الحد الأعلى لقانون الإصلاح الزراعي.", "لا يجوز تأليف جمعية فلاحية في القرية الواحدة أو عدة قرى إذا قلّ عدد أعضائها عن ثلاثين عضوًا."], "trap": "لا تخلط الهرم التنظيمي: جمعية (قرية) → رابطة (منطقة) → اتحاد (محافظة) → اتحاد عام (قطر) — الترتيب صاعد وثابت ويُختبر بأسئلة ترتيب.", "example": "جمعية فلاحية في إحدى قرى ريف الحسكة تنضم إلى رابطة فلاحية على مستوى المنطقة، والتي بدورها جزء من اتحاد فلاحي محافظة الحسكة، المنضوي تحت الاتحاد العام للفلاحين في دمشق."}, {"title": "الوحدة ٢٠ — القطاع الزراعي السوري وتاريخ التعاون الزراعي", "points": ["أول جمعية تعاونية فلاحية في سوريا تأسست عام ١٩٤٣ في قرية دير عطية بريف دمشق، بهدف تحسين أوضاع الفلاحين.", "القانون ٥٦ لعام ١٩٥٨: أول تشريع لتنظيم التعاون، حدد الأسس التنظيمية والإدارية وأنواع الجمعيات (إنتاج، تصريف، استهلاك، تمويل، إقراض، ري، حراثة، إسعاف، نقل).", "القانون ١٦١ لعام ١٩٥٨: خاص بالإصلاح الزراعي، ألزم المنتفعين بالانتساب للجمعيات التعاونية، وحدد سقف الملكية.", "القانون ١٣٠ لعام ١٩٥٨: حوّل المصرف الزراعي إلى مصرف زراعي تعاوني.", "القانون ١٣٤ لعام ١٩٥٨: نظّم العلاقات الزراعية الاستئجارية بين الفلاحين (عُدّل بالمرسوم ٢١٨ لعام ١٩٦٣).", "يبلغ عدد الجمعيات التعاونية الزراعية في سوريا ٥٦٢١ جمعية بـ٩٩٤٨٢٠ عضوًا (منهم ٩٦٩٢١ أختًا فلاحة)، وتساهم بنحو ٤٦٪ من مساحة الأرض المستثمرة زراعيًا.", "الزراعة تسهم بنحو ١٧٫٦٪ من الناتج المحلي الإجمالي، ويعمل بالقطاع نحو ١٧٪ من قوة العمل."], "trap": "أربعة قوانين صدرت جميعها عام ١٩٥٨ ولكل منها موضوع مختلف تمامًا: ٥٦ (تنظيم عام)، ١٦١ (إصلاح زراعي)، ١٣٠ (المصرف الزراعي التعاوني)، ١٣٤ (علاقات زراعية استئجارية) — لا تخلط الأرقام بمواضيعها.", "example": "مزارع في الجزيرة السورية استفاد من أراضي الإصلاح الزراعي بموجب القانون ١٦١ لعام ١٩٥٨، وأصبح إلزاميًا منتسبًا لجمعية تعاونية زراعية، ويحصل على قروض من المصرف الزراعي التعاوني المؤسس بموجب القانون ١٣٠ لعام ١٩٥٨."}, {"title": "الوحدة ٢١ — مشكلات القطاع التعاوني الفلاحي في سوريا", "points": ["أهم المشكلات: ضعف رأس المال، ضعف الوعي التعاوني، ضعف الانتقال إلى آليات الإنتاج، ارتفاع نسبة الأمية، التركيز على الجمعيات متعددة الأغراض وإهمال الجمعيات التسويقية، ضعف مواكبة التطور التقني، قلة الكادر الفني والعلمي، ضعف المكننة الزراعية.", "معوقات تنسيب المرأة الفلاحة للتنظيم: الواقع الاجتماعي في الريف، تفشي الأمية بين النساء، وكون الحيازة الزراعية غالبًا بتصرف رب الأسرة (الرجل) الذي ينتسب نيابة عن الأسرة."], "trap": "مشكلات القطاع التعاوني الفلاحي كثيرة ومتشابكة — أكثرها تكرارًا في الأسئلة: ضعف رأس المال، ضعف التحول من جمعيات خدمية إلى جمعيات إنتاجية، وقلة الجمعيات التسويقية تحديدًا (وليس نقص عدد الجمعيات نفسها).", "example": "جمعية زراعية في ريف الحسكة تبقى جمعية خدمية بسيطة (توزيع بذار وسماد) دون أن تتطور إلى جمعية تسويقية أو إنتاجية قادرة على تصنيع وتسويق المحاصيل — وهذا من أبرز أوجه القصور المذكورة في النوطة."}], "quiz": [{"q": "ماذا يعني التعاون لغةً؟", "opts": ["العمل معًا ومساعدة الآخرين", "تنظيم اقتصادي ربحي فقط", "اتفاق تجاري بين شركتين", "نشاط حكومي مركزي"], "a": 0, "legal": "التعاون لغةً: العمل معًا ومساعدة الآخرين.", "simple": "المعنى اللغوي بسيط: أفراد يعملون سويًا ويساعد بعضهم بعضًا.", "ex": "جيران في حي بالقامشلي يتشاركون في شراء مياه الشرب جملة — تعاون بمعناه اللغوي البسيط.", "trap": "لا تخلط المعنى اللغوي البسيط بالمعنى الاصطلاحي الأوسع (تنظيم ديمقراطي بمصلحة مشتركة)."}, {"q": "كيف تطوّر مفهوم التعاون اصطلاحًا؟", "opts": ["أصبح تنظيمًا اختياريًا قائمًا على أسس ديمقراطية لتحقيق مشاريع مشتركة", "أصبح شكلًا من أشكال الملكية الخاصة الفردية", "أصبح مرادفًا للعمل الحكومي المركزي", "أصبح مقتصرًا على القطاع الصناعي فقط"], "a": 0, "legal": "التعاون اصطلاحًا: تنظيم اختياري قائم على أسس ديمقراطية بين أفراد تربطهم مصلحة مشتركة، بغرض تحقيق مشاريع مشتركة.", "simple": "أربعة عناصر لازمة: اختياري + ديمقراطي + مصلحة مشتركة + مشروع مشترك.", "ex": "مجموعة موظفين في مؤسسة STEP بالقامشلي ينشئون جمعية تعاونية اختيارية لشراء المستلزمات المكتبية جملة وتوزيعها بالتساوي حسب الحاجة.", "trap": "الامتحان قد يطرح تعريفًا ناقصًا (يذكر عنصرين فقط) كإجابة خاطئة مموّهة — تحقق من اكتمال العناصر الأربعة."}, {"q": "ما هو أساس تصنيف الجمعيات إلى إنتاجية أو للمستهلكين؟", "opts": ["المستفيد من نشاط الجمعية", "حجم رأس المال", "عدد الأعضاء", "موقع الجمعية الجغرافي"], "a": 0, "legal": "من أقسام الجمعيات حسب المستفيدين: التعاونية الإنتاجية، والتعاونية للمستهلكين.", "simple": "المعيار هو: من يستفيد؟ المنتِج نفسه أم المستهلك النهائي؟", "ex": "جمعية تعاونية في الحسكة يشترك فيها منتجو ألبان (إنتاجية) مقابل جمعية أخرى يشترك فيها مستهلكون لشراء المواد الغذائية (للمستهلكين).", "trap": "لا تخلط هذا التقسيم (حسب المستفيد) بالتقسيم الآخر حسب الغرض (استهلاكية/خدمية/إنتاجية/حرفية/زراعية) — هما تصنيفان مختلفان في النوطة."}, {"q": "متى تُعد الجمعية تعاونية استهلاكية نموذجية؟", "opts": ["حين تبيع السلع للأعضاء بسعر التكلفة دون تحقيق ربح، وتوزّع الفرق حسب نسبة مشترياتهم", "حين توزّع الربح على الأعضاء حسب عدد الأسهم فقط", "حين تقتصر على بيع السلع الزراعية فقط", "حين تكون مملوكة بالكامل للدولة"], "a": 0, "legal": "الجمعيات التي يقوم بإنشائها المستهلكون بغرض الحصول على السلع، ويبيعونها بسعر التكلفة دون أن تحقق ربحًا، وتوزّع نسبة الناتج (العائد) عليهم حسب مشترياتهم.", "simple": "الهدف الأساسي: توفير السلع للأعضاء بأرخص سعر ممكن، لا تحقيق ربح تجاري.", "ex": "جمعية استهلاكية بالقامشلي تبيع المواد الغذائية لأعضائها بسعر التكلفة، وفي نهاية العام تعيد أي فائض حسب حجم مشتريات كل عضو.", "trap": "لا تفترض أن العائد يوزَّع حسب عدد الأسهم — التوزيع في الجمعية الاستهلاكية يكون حسب حجم التعامل (المشتريات)."}, {"q": "أي مما يلي مثال على جمعية تعاونية خدمية؟", "opts": ["جمعية تؤمّن لأعضائها فقط السكن أو التأمين أو النقل أو الخدمات الصحية", "جمعية تنتج وتبيع السلع الزراعية للجمهور", "جمعية تصنّع أثاثًا وتبيعه بالجملة للتجار", "جمعية استثمارية عقارية تجارية"], "a": 0, "legal": "الجمعية التعاونية الخدمية: تكون كذلك عند اقتصار نشاطها على تأمين خدمة معينة لأعضائها فقط، كالسكن أو التأمين أو النقل والاتصالات أو الخدمات الصحية أو الكهرباء أو الخدمات المدرسية.", "simple": "المعيار: خدمة محددة تُقدَّم حصريًا للأعضاء وليس للجمهور.", "ex": "جمعية تعاونية للكهرباء في قرية بريف الحسكة تؤمن التيار لأعضائها المشتركين فقط دون غيرهم.", "trap": "الجمعية الخدمية أنواع متعددة (سكن، تأمين، نقل، صحة، كهرباء، مدارس) — الأسئلة قد تخلط بين نوع وآخر فانتبه للتفصيل المذكور بالسؤال."}, {"q": "ما الذي يميّز الجمعية التعاونية الإنتاجية؟", "opts": ["يزاول العمال الإنتاج بأنفسهم ويتحملون الربح والخسارة جميعًا", "تقتصر على شراء السلع للأعضاء بسعر التكلفة", "تديرها الدولة مباشرة دون مجلس إدارة منتخب", "لا تقبل عضوية العمال إطلاقًا"], "a": 0, "legal": "تُعد الجمعية تعاونية للإنتاج إذا اقتصر نشاطها على إنتاج السلع والخدمات، بحيث يزاول مجموعة من العمال العمل والإنتاج بأنفسهم؛ فإن حققت ربحًا فهو لهم، وإن خسرت تحمّل الخسارة جميع أعضائها، وغالبًا تنشأ في الصناعات الخفيفة قليلة التكاليف.", "simple": "العمال هنا هم أنفسهم أصحاب الجمعية والمنتجون فيها معًا.", "ex": "مجموعة حرفيين في القامشلي ينتجون منسوجات يدوية بأنفسهم عبر جمعية تعاونية إنتاجية، ويقتسمون الربح أو الخسارة بالتساوي.", "trap": "لا تخلط بين الإنتاجية (العمال منتجون وأصحاب مصلحة معًا) والحرفية (تجمع أصحاب حرفة واحدة لتحسين وضعهم دون شرط الإنتاج المشترك المباشر)."}, {"q": "ما أبرز الإصلاحات التي طبّقها روبرت أوين في مصانع نيولانارك؟", "opts": ["خفض ساعات العمل، منع تشغيل الأطفال دون سن العاشرة، وأنشأ صندوق ضمان صحي ومساكن بأسعار معقولة", "رفع أسعار السلع لتحقيق أرباح أكبر", "إلغاء التعليم المجاني للأطفال", "زيادة ساعات العمل لتحسين الإنتاجية"], "a": 0, "legal": "خفّض أوين ساعات العمل اليومي من ١٧ إلى ١٠ ساعات، ومنع تشغيل الأطفال دون سن العاشرة ونظّم لهم تعليمًا مجانيًا، ورفع أجور العاملين، وألغى الغرامات المالية، وأنشأ صندوق ضمان صحي ومساكن بأسعار معقولة، وافتتح محلًا يبيع مستلزمات الحياة بسعر التكلفة.", "simple": "أوين كان صاحب مصنع طبّق إصلاحات اجتماعية جذرية لعماله قبل أن يتحول لفكرة تعاونية شاملة.", "ex": "يشبه هذا مصنعًا محليًا يقرر تخفيض ساعات دوام عماله وتوفير رعاية صحية مجانية لهم كإجراء اجتماعي داخلي.", "trap": "أوين لم يكن ينظّر فقط بل طبّق فعليًا في مصنعه الخاص — هذا يميزه عن لويس بلان الذي بقي في حدود الاقتراح النظري ودعوة الدولة للتدخل."}, {"q": "ما الذي حدث لتجربة مستعمرة «هارموني الجديدة» التي أسسها أوين في أمريكا؟", "opts": ["فشلت عام ١٨٢٧ بسبب عدم تكيف الأعضاء واختلافهم في الدين والسياسة", "نجحت واستمرت حتى اليوم كنموذج عالمي", "تحولت إلى شركة مساهمة كبرى", "اندمجت مع جمعية روتشدال"], "a": 0, "legal": "فشلت تجربة الجمعية بمساواة أوين عام ١٨٢٧ بسبب عدم تكيف الساكنين مع فكرة العمل المنظم بين مشتركين بعضهم واختلافهم في أمور الدين والسياسة.", "simple": "المستعمرة كانت تجربة طوباوية لمجتمع مكتفٍ ذاتيًا، لكن التنوع الفكري والديني بين أعضائها أدى لتصادمات أفشلتها.", "ex": "يشبه هذا محاولة إنشاء مجتمع تعاوني مغلق يضم أفرادًا من خلفيات مختلفة تمامًا دون قواعد واضحة لإدارة الخلاف — ينتهي غالبًا بالانهيار.", "trap": "لا تخلط سبب فشل «هارموني الجديدة» (اختلاف الدين والسياسة) بسبب فشل «محل التبادل العادل للعمل» (مشاكل بطاقات العمل) — هما تجربتان منفصلتان لأوين بأسباب فشل مختلفة."}, {"q": "لماذا فشلت فكرة «بطاقات العمل» التي اعتمدها روبرت أوين لإلغاء الربح؟", "opts": ["بسبب سوء تقدير قيمة السلع، وإهمال جودتها، واستغلال التجار والمضاربين لها", "لأن الحكومة البريطانية منعتها بقرار رسمي", "لأن الأعضاء رفضوا المشاركة من الأساس", "بسبب ارتفاع تكلفة طباعة البطاقات فقط"], "a": 0, "legal": "أسباب الفشل: (أ) سوء تقدير قيمة السلع عند البيع (ب) عدم مراعاة نوعية السلعة المنتجة (ج) استخدام التجار لهذه البطاقات لشراء أفضل السلع وإعادة بيعها بربح (د) استغلال بعض الأعضاء الجدد قليلي الأمانة بإحضار بضائع رديئة.", "simple": "النظام اعتمد على ساعات العمل فقط كمعيار للقيمة، متجاهلًا جودة السلعة، ففُتح الباب للاستغلال.", "ex": "لو طبّقت جمعية اليوم نظام تسعير قائم فقط على «عدد ساعات العمل» بغض النظر عن جودة المنتج، ستواجه نفس مشكلة تراكم البضائع الرديئة وهروب الجيدة منها.", "trap": "أربعة أسباب متكاملة وليست سببًا واحدًا — الأسئلة قد تطرح سببًا واحدًا فقط كإجابة (خاطئة لأنها ناقصة) أو تخلط بين الأسباب."}, {"q": "ما الفكرة الأساسية وراء «محل التبادل العادل للعمل» الذي أسسه أوين؟", "opts": ["إلغاء النقود واعتماد بطاقات عمل يحصل عليها المنتج بحسب ساعات إنتاج السلعة", "بيع السلع بأسعار السوق العادية دون تدخل", "تحويل المحل إلى شركة مساهمة كبرى", "فرض ضريبة ثابتة على كل معاملة"], "a": 0, "legal": "ألغى أوين النقود الورقية كأداة للدفع، واعتمد بطاقات العمل التي تُصرف على أساس عدد الساعات المبذولة في إنتاج السلعة، فيحصل المنتج على بطاقات، ويدفع المستهلك ثمن السلعة عبرها.", "simple": "الفكرة: القضاء على الربح والوساطة عبر ربط قيمة كل سلعة بساعات العمل فقط.", "ex": "لو أراد حرفي في القامشلي تطبيق هذه الفكرة، سيحصل على «بطاقة عمل» عن كل ساعة عمل بدل النقود، ويستبدلها لاحقًا بسلع أخرى من المحل مباشرة.", "trap": "أُغلق المحل بعد سنتين فقط من التطبيق — رقم «سنتين» يُختبر أحيانًا مقابل أرقام أخرى (سنة، خمس سنوات)."}, {"q": "لماذا نشأت تجربة رواد روتشدال؟", "opts": ["نتيجة جشع التجار وبيعهم السلع بأسعار مرتفعة وبالنسيئة مما أثقل العمال بالديون", "بسبب قرار حكومي بإلزام العمال بتأسيس جمعيات", "بهدف تجريبي أكاديمي بحت دون دافع اجتماعي", "لتجنب دفع الضرائب على السلع"], "a": 0, "legal": "جاءت الجمعية نتيجة الظلم الذي عاناه العمال من جشع التجار الذين كانوا يبيعون السلع الاستهلاكية بأسعار مرتفعة، مما اضطرهم لشراء السلع بالنسيئة (بالدين)، فتراكمت الفوائد على السعر المرتفع أصلًا.", "simple": "دافع اقتصادي-اجتماعي واضح: حماية العمال من استغلال التجار.", "ex": "عمال في مدينة إنكليزية اجتمعوا (٢٨ شخصًا) لتأسيس محل يبيعهم السلع مباشرة بدل شرائها بالدين من تجار يستغلون حاجتهم.", "trap": "العدد الدقيق للمؤسسين هو ٢٨ شخصًا — رقم يُختبر مقابل أرقام قريبة (٢٥، ٣٠) للتمويه."}, {"q": "ما هو المبدأ الذي اعتمدته جمعية روتشدال في تسعير السلع، خلافًا لأوين؟", "opts": ["البيع بسعر السوق مع إعادة الربح للأعضاء لاحقًا حسب مشترياتهم", "البيع بسعر التكلفة دون أي ربح إطلاقًا", "البيع بسعر أقل من التكلفة لجذب الزبائن", "تحديد سعر موحد لكل السلع بغض النظر عن نوعها"], "a": 0, "legal": "بيع السلع الاستهلاكية بسعر السوق على الرغم من أن الجمعية تحصل عليها بسعر الجملة، تجنبًا للمجابهة مع التجار، على أن يُعاد الربح المحقق إلى الأعضاء حسب مشترياتهم من الجمعية.", "simple": "هذا الفارق الجوهري عن أوين: روتشدال لا تلغي الربح بل تجمعه ثم تعيده بعدالة للأعضاء.", "ex": "جمعية استهلاكية تبيع بسعر السوق مثل أي متجر عادي، لكنها في نهاية العام تعيد لكل عضو نسبة من الأرباح بحسب ما اشتراه فعليًا خلال السنة.", "trap": "لا تخلط مبدأ روتشدال (بيع بسعر السوق + إعادة الربح لاحقًا) بمبدأ الجمعية الاستهلاكية العامة الوارد في وحدة أخرى (بيع بسعر التكلفة دون ربح) — كلاهما وارد في النوطة بسياقين مختلفين."}, {"q": "كم كانت نسبة الفائدة القصوى التي حددتها مبادئ روتشدال على الأسهم؟", "opts": ["لا تزيد عن ٥٪", "لا تزيد عن ١٠٪", "لا تزيد عن ١٥٪", "لا حد أقصى لها"], "a": 0, "legal": "منح فائدة محددة على الأسهم لا تزيد عن ٥٪، وتوزع الأرباح الصافية بعد ذلك على الأعضاء حسب نسبة تعاملهم مع الجمعية.", "simple": "٥٪ هو السقف الأقصى الذي وضعته مبادئ روتشدال الأصلية على فائدة الأسهم.", "ex": "عضو في جمعية استهلاكية يملك أسهمًا بقيمة معينة يحصل على فائدة سنوية لا تتجاوز ٥٪ من قيمتها، مهما ارتفعت أرباح الجمعية.", "trap": "انتبه: النوطة تذكر لاحقًا في سياق آخر (صفحة أسهم الجمعية الاستهلاكية السورية) رقم ٦٪ كحد أقصى لفائدة السهم — هذان رقمان من مصدرين مختلفين (مبادئ روتشدال التاريخية مقابل النص السوري) فلا تخلط بينهما."}, {"q": "ما نسبة الأرباح التي خصصتها روتشدال للأغراض الاجتماعية والثقافية؟", "opts": ["٢٫٥٪", "٥٪", "١٠٪", "٢٠٪"], "a": 0, "legal": "تخصيص نسبة ٢٫٥٪ من الأرباح للأغراض الاجتماعية والثقافية.", "simple": "جزء بسيط لكنه ثابت من الأرباح يُوجَّه لخدمة المجتمع والتثقيف، لا للأعضاء مباشرة.", "ex": "جمعية استهلاكية تخصص ٢٫٥٪ من أرباحها السنوية لدعم نشاط تثقيفي أو اجتماعي لأعضائها أو مجتمعها المحلي.", "trap": "لا تخلط هذه النسبة (٢٫٥٪ للأغراض الاجتماعية والثقافية عند روتشدال) بنسبة الاحتياطي القانوني الإجباري لاحقًا في القانون السوري (٢٠٪ على الأقل) — أرقام من سياقات مختلفة تمامًا."}, {"q": "من هو وليم كنج ولماذا تُعد تجربته أنجح من تجربة أوين؟", "opts": ["أسس أول محل تعاوني في برايتون عام ١٨٢٧ اعتمادًا على رأسمال حقيقي وأرباح فعلية", "هو مؤسس حلف التعاون الدولي في لندن", "هو صاحب فكرة الفالانستير في فرنسا", "هو مؤسس المصرف الزراعي التعاوني في ألمانيا"], "a": 0, "legal": "أنشأ وليم كنج أول محل لبيع السلع في مدينة برايتون عام ١٨٢٧، وهي محلات تعاونية أشبه بمخازن تقيمها جمعيات من العمال برأس مال يشتركون فيه، فيشترون السلع بسعر الجملة ويحققون أرباحًا يحتفظون بها لصالح الأعضاء مستقبلًا.", "simple": "نجحت تجربة كنج لأنها اعتمدت على رأس مال حقيقي وسمحت بتحقيق ربح فعلي (بخلاف بطاقات العمل الوهمية لدى أوين).", "ex": "متجر تعاوني يجمع فيه عمال رأس مالهم لشراء بضائع جملة وبيعها لأنفسهم موفرين أرباح تجار التجزئة — نموذج أقرب للجمعيات الاستهلاكية الحديثة.", "trap": "لا تخلط بين وليم كنج (برايتون، ١٨٢٧) وروتشدال (١٨٤٤) — كنج سابق زمنيًا وأرسى تجربة أقرب للنموذج التعاوني الحديث، لكن روتشدال هي الأشهر والأكثر تفصيلًا بالمبادئ."}, {"q": "ما الحل الذي اقترحه لويس بلان لمشكلات العمال؟", "opts": ["تدخل الدولة لبناء ورشات اجتماعية يجتمع فيها عمال الحرفة الواحدة", "إلغاء الدولة تمامًا من الاقتصاد", "إنشاء مستعمرات مكتفية ذاتيًا دون تدخل حكومي", "فرض ضرائب باهظة على التجار فقط"], "a": 0, "legal": "رأى بلان أن حل مشكلات العمال يكون عبر التعاون وليس عبر المستعمرات المعتمدة على الاكتفاء الذاتي، وأن الدولة يجب أن تساعد العمال ببناء ورشات اجتماعية يجتمع فيها كل من ينتمون إلى حرفة وورشة واحدة.", "simple": "بلان يختلف عن أوين وفوريه: هو يراهن على دور الدولة لا على استقلالية المستعمرة.", "ex": "لو طبّقت وزارة سورية فكرة بلان، ستنشئ ورشة حكومية مدعومة تجمع كل الحرفيين من تخصص واحد (كالنجارة مثلًا) في مدينة معينة.", "trap": "لا تنسب فكرة «الاكتفاء الذاتي بمستعمرة مستقلة» لبلان — هذه فكرة أوين وفوريه، بينما بلان اعتمد على تدخل الدولة صراحة."}, {"q": "كيف اقترح لويس بلان توزيع دخل الورشات الاجتماعية؟", "opts": ["إلى ثلاثة أجزاء: للعمال بالتساوي، لصندوق تضامن اجتماعي، ولتوسيع الورشة", "إلى جزأين فقط: للعمال وللدولة", "بالكامل للدولة كضريبة", "بالتساوي بين العمال وأصحاب رؤوس الأموال فقط"], "a": 0, "legal": "الجزء الأول للعمال يوزَّع بينهم بالتساوي، الجزء الثاني لدعم صندوق التضامن الاجتماعي الذي يقدم العون للمرضى والعجزة، الجزء الثالث لتوسيع الورشات عبر تزويدها بالآلات والأدوات اللازمة لتوفير فرص عمل جديدة.", "simple": "توزيع ثلاثي متوازن: مكافأة مباشرة + ضمان اجتماعي + استثمار مستقبلي.", "ex": "ورشة نجارة تعاونية توزّع أرباحها: جزء للنجارين مباشرة، جزء لصندوق يعين المريض منهم، وجزء لشراء آلات جديدة لتوسيع الورشة.", "trap": "الترتيب الثلاثي (عمال / تضامن اجتماعي / توسيع) قد يُطرح بترتيب معكوس في الخيارات لاختبار الحفظ الدقيق."}, {"q": "ما الذي ميّز أفكار شارل فوريه التعاونية؟", "opts": ["طبيعة مختلطة جمعت بين الجانب الإنتاجي والاستهلاكي معًا", "اقتصارها على الجانب الاستهلاكي فقط", "اعتمادها الكامل على تمويل الدولة", "رفضها التام لفكرة العمل الجماعي"], "a": 0, "legal": "تتميز أفكار فوريه بأنها ذات طبيعة مختلطة بحيث جمعت بين التعاونيات الإنتاجية والتعاونيات الاستهلاكية في ذات الوقت.", "simple": "فوريه لم يفصل بين الإنتاج والاستهلاك، بل تصور مجتمعًا تعاونيًا متكاملًا يجمعهما.", "ex": "مستعمرة فالانستير يعمل فيها الأعضاء إنتاجًا زراعيًا وصناعيًا، ويستهلكون أيضًا ما ينتجونه ضمن المستعمرة نفسها.", "trap": "لا تخلط بين فوريه (طبيعة مختلطة إنتاجية+استهلاكية) وبلان (إنتاجية بحتة عبر ورشات مدعومة بالدولة) عند سؤال المقارنة بينهما."}, {"q": "ما اسم المستعمرة الزراعية التعاونية التي اقترحها فوريه؟", "opts": ["فالانستير", "هارموني الجديدة", "نيولانارك", "روتشدال"], "a": 0, "legal": "رأى فوريه حل المشاكل عبر إنشاء جماعات متكاملة (كتانات) تعيش في مستعمرة زراعية تعاونية تسمى فالانستير.", "simple": "اسم يميّز مشروع فوريه الفرنسي عن مستعمرة أوين الأمريكية (هارموني الجديدة).", "ex": "لو أُنشئت مستعمرة فالانستير اليوم، لضمّت ١٩٠٠–٢٠٠٠ عضو يعملون بالزراعة والصناعة معًا ويقتسمون الناتج حسب العمل ورأس المال والمهارة.", "trap": "لا تخلط بين «هارموني الجديدة» (أوين، أمريكا) و«فالانستير» (فوريه، فرنسا) — كلاهما مستعمرات تعاونية لكن من روّاد ودول مختلفة."}, {"q": "كيف اقترح فوريه توزيع الناتج الجماعي في المستعمرة؟", "opts": ["١٢٫٥ للعمال، ١٢٫٤ لصاحب رأس المال، ١٢٫٣ للمهارة أو العمل الذهني", "بالتساوي التام بين الجميع دون تمييز", "للدولة بالكامل ثم تعيد توزيعه", "حسب عدد أفراد الأسرة فقط"], "a": 0, "legal": "اقترح فوريه توزيع الناتج من الاقتصاد الجماعي وفق النسب التالية: ١٢٫٥ للعمال، ١٢٫٤ لصاحب رأس المال، ١٢٫٣ للمهارة أو العمل الذهني، ويمكن لكل عضو أن يساهم بأحد هذه الأقسام أو ببعضها أو فيها جميعًا.", "simple": "توزيع يعترف بثلاثة عناصر إنتاج: العمل، ورأس المال، والمهارة الذهنية.", "ex": "عضو في فالانستير يعمل بيده وله رأس مال ومهارة فنية ت جلسات متتالية بدون عذر، عدم المحافظة على سجلات وأوراق الجمعية أو إتلافها أو إخفائها، مخالفة القوانين والأنظمة المتعلقة بالوزارة، عدم رد العهدة المالية الشخصية خلال الأجل المحدد أو الامتناع عن تنفيذ قرار تسليم الأموال والموجودات.", "simple": "أسباب إدارية متعددة لسقوط العضوية غير الانسحاب الطوعي أو الوفاة، تتعلق غالبًا بالإخلال بالالتزامات.", "ex": "عضو مجلس إدارة جمعية سكنية بالقامشلي تغيب عن ست جلسات متتالية دون تقديم أي عذر مقبول — يحق للوزير إسقاط عضويته بناء على هذا السبب.", "trap": "لا تخلط عدد الجلسات المطلوب للتغيب في الجمعية السكنية (ست جلسات متتالية) بعدد جلسات مجلس إدارة الجمعية الاستهلاكية (ثلاث جلسات متتالية) — رقمان مختلفان لنوعين مختلفين من الجمعيات."}, {"q": "ما الذي يُحظر على عضو مجلس إدارة الجمعية التعاونية السكنية؟", "opts": ["الاشتراك في التصويت عند وجود مصلحة شخصية، وممارسة أعمال التعهدات والتوريدات لدى الجمعية عبر أقربائه حتى الدرجة الرابعة", "حضور اجتماعات مجلس الإدارة بانتظام", "الترشح لعضوية المجلس أكثر من مرة", "الإدلاء برأيه في اجتماعات الجمعية العمومية"], "a": 0, "legal": "يُحظر على عضو مجلس الإدارة: الاشتراك في التصويت في المجلس إذا كان له مصلحة شخصية في القرار المعروض، ممارسة أعمال التعهدات والأشغال والتوريدات لدى شركائه وأقربائه حتى الدرجة الرابعة، الجمع بين عضوية المجلس وممارسة أي مهنة حرة لدى الجمعية، استخدام أموال أو مدفوعات الأعضاء في غير أغراض الجمعية.", "simple": "قيود تمنع تضارب المصالح وتحمي أموال الجمعية من استغلال أعضاء مجلس إدارتها.", "ex": "عضو مجلس إدارة له قريب من الدرجة الثالثة يعمل مقاولًا، لا يجوز له التصويت على قرار يخص التعاقد مع هذا القريب بسبب تضارب المصلحة.", "trap": "الحظر يشمل الأقارب حتى الدرجة الرابعة تحديدًا — لا تفترض أنه يقتصر على الدرجة الأولى (الأبناء والوالدين) فقط."}, {"q": "كيف تُبلَّغ الدعوة لاجتماع الهيئة العامة في الجمعية التعاونية السكنية؟", "opts": ["تبليغًا خطيًا مباشرًا أو برسالة مسجلة، مع نشرها بالصحف ولصقها على لوحة إعلانات الجمعية قبل الموعد بخمسة عشر يومًا", "بمكالمة هاتفية فقط دون أي توثيق", "عبر منشور يُوزَّع يوم الاجتماع نفسه", "لا تحتاج أي إعلان مسبق"], "a": 0, "legal": "يجب تبليغ العضو الدعوة لاجتماع الهيئة العامة تبليغًا خطيًا بإشعار مباشر باليد أو بواسطة رسالة مسجلة ترسل إلى موطنه المختار، وفي جميع الأحوال يتم نشر إعلان الدعوة في الصحف قبل خمسة عشر يومًا من الموعد المحدد للاجتماع، ويُلصق الإعلان على لوحة إعلانات الجمعية إلى حين موعد الاجتماع.", "simple": "ثلاث وسائل تبليغ متوازية (خطي مباشر أو مسجل + نشر صحفي + لوحة إعلانات) لضمان وصول الدعوة لأكبر عدد من الأعضاء.", "ex": "جمعية سكنية بالقامشلي تريد عقد اجتماعها العام السنوي، فترسل إشعارات خطية للأعضاء وتنشر إعلانًا بالصحف المحلية قبل الاجتماع بخمسة عشر يومًا على الأقل.", "trap": "مهلة الخمسة عشر يومًا للدعوة تتكرر في أكثر من موضع بالنوطة (الجمعية الاستهلاكية والسكنية) — لا تخلطها بمهلة الأربعة أشهر لعقد الجمعية العمومية السنوية نفسها."}, {"q": "ما شروط عضوية مجلس إدارة الجمعية التعاونية السكنية؟", "opts": ["أن يكون من أعضاء الجمعية، بلغ الخامسة والعشرين، متمتعًا بحقوقه المدنية والسياسية، بريء الذمة تجاه الجمعية", "أن يكون قد بلغ الأربعين من عمره على الأقل", "أن يكون حاصلًا على شهادة جامعية في القانون", "لا شروط محددة سوى الرغبة بالترشح"], "a": 0, "legal": "من شروط العضوية في مجلس الإدارة: من أعضاء الجمعية، متمتعًا للخامسة والعشرين من العمر قبل انعقاد الهيئة العامة، متمتعًا بحقوقه المدنية والسياسية، غير محكوم بعقوبة جنائية أو جنحة مخلة بالشرف أو الأمانة، بريء الذمة نحو الجمعية بالنسبة للأموال والأقساط المستحقة، ألا تربطه صلة قرابة حتى الدرجة الثانية بأحد أعضاء إدارة الجمعية نفسها.", "simple": "شروط متعددة تجمع بين السن الأدنى (٢٥) والنزاهة المالية والقانونية ومنع محاباة الأقارب داخل نفس المجلس.", "ex": "شاب عمره ٢٦ عامًا عضو في جمعية سكنية، بريء الذمة تجاه الجمعية، ولا تربطه قرابة بأي عضو حالي بمجلس الإدارة، يستوفي شروط الترشح لعضوية المجلس.", "trap": "سن الترشح لمجلس إدارة الجمعية السكنية (٢٥ سنة) يختلف عن الحد الأدنى لعضوية مجلس إدارة الجمعية الاستهلاكية العامة (لا يُذكر فيها سن أدنى صريح بل شرط سنة انتساب) — لا تعمم رقم السن بين أنواع الجمعيات."}, {"q": "متى يمكن للوزير إسقاط العضوية عن عضو أو أكثر من أعضاء مجلس إدارة الاتحاد العام السكني بناء على اقتراح الاتحاد؟", "opts": ["التخلف عن حضور ست جلسات متتالية بدون عذر، أو مخالفة القوانين والأنظمة، أو الإضرار بمصالح الجهة التعاونية", "فقط في حال وفاة العضو", "فقط إذا طلب العضو نفسه ذلك كتابيًا", "لا يملك الوزير هذه الصلاحية إطلاقًا"], "a": 0, "legal": "للوزير بمبادرة منه أو بناء على اقتراح الاتحاد العام إسقاط العضوية عن عضو أو أكثر من أعضاء مجلس الإدارة في حالات: التخلف عن حضور ست جلسات متتالية بدون عذر، عدم المحافظة على السجلات والأوراق أو إتلافها أو إخفائها، مخالفة القوانين والأنظمة، عدم رد العهدة المالية الشخصية، القيام بأي عمل من شأنه الإضرار بمصالح الجهة التعاونية بنظام الإخلال أو عرقلة نشاطها عن عمد أو إهمال جسيم.", "simple": "صلاحية استثنائية للوزير لضبط انضباط مجالس الإدارة في القطاع السكني التعاوني.", "ex": "عضو مجلس إدارة اتحاد سكني تعاوني أهمل واجباته بشكل جسيم أضرّ بمصالح الجمعية، ما يخوّل الوزير إسقاط عضويته بناءً على اقتراح من الاتحاد العام.", "trap": "هذه الصلاحية للوزير في قطاع السكن التعاوني تحديدًا — لا تعمم وجود صلاحية مماثلة للوزير في كل أنواع الجمعيات الأخرى دون نص صريح."}, {"q": "ما هي المصادر الخارجية لتمويل الجمعيات التعاونية الاستهلاكية؟", "opts": ["القروض والودائع", "الضرائب الحكومية المباشرة فقط", "التبرعات الأجنبية فقط", "بيع الأسهم للجمهور العام"], "a": 0, "legal": "من أصول المصادر الخارجية لتمويل الجمعيات التعاونية الاستهلاكية: القروض، والودائع.", "simple": "بخلاف المصادر الداخلية (رأس المال والاحتياطي)، المصادر الخارجية تعتمد على الاقتراض وقبول الودائع من الغير.", "ex": "جمعية استهلاكية تحتاج تمويلًا إضافيًا لتوسيع نشاطها تلجأ لطلب قرض من مصرف التسليف الشعبي، أو تقبل ودائع من أفراد يثقون بها.", "trap": "لا تخلط المصادر الخارجية (قروض وودائع) بالمصادر الداخلية أو الذاتية (رأس المال والمال الاحتياطي) المذكورة في وحدة أخرى من النوطة — تصنيفان متكاملان لتمويل الجمعية."}, {"q": "من الجهة التي تعتمد عليها الجمعيات التعاونية الاستهلاكية في حصولها على القروض؟", "opts": ["مصرف التسليف الشعبي والمصرف التجاري، عبر تقديم طلب لوزارة التجارة الداخلية وحماية المستهلك", "المصارف الأجنبية حصرًا دون أي وساطة حكومية", "الأفراد فقط دون أي مصرف رسمي", "لا يجوز للجمعيات الاستهلاكية الاقتراض إطلاقًا"], "a": 0, "legal": "تعتمد الجمعيات التعاونية الاستهلاكية في حصولها على القروض على مصرف التسليف الشعبي والمصرف التجاري، وذلك عبر تقديم طلب القرض إلى وزارة التجارة الداخلية وحماية المستهلك التي تقوم بدراسته، فإذا قبلته توجه كتابًا للمصرف بذلك.", "simple": "الطريق الإداري للاقتراض يمر عبر الوزارة كوسيط بين الجمعية والمصرف، لا اتصالًا مباشرًا.", "ex": "جمعية استهلاكية في الحسكة تحتاج قرضًا لتوسيع مستودعاتها تتقدم بطلب لوزارة التجارة الداخلية، والتي تدرسه وتحيله لمصرف التسليف الشعبي إن وافقت عليه.", "trap": "لاحظ أن الوزارة أيضًا يمكنها رفض القرض إذا وجدت أن استعمال المبلغ لا يخدم منفعة عامة أو يخص إنشاء جمعية جديدة غير مبرر — الموافقة ليست تلقائية."}, {"q": "ما الحدود التي يجب على الجمعية مراعاتها عند توظيف الودائع التي تقبلها؟", "opts": ["ألا يتجاوز توظيفها ٥٠٪ من قيمتها، وألا تُستعمل لأغراض تتجاوز ٧٠٪ من قيمتها، وألا تُستعمل لأغراض تتجاوز موعد استحقاقها", "يمكن توظيف كامل الودائع دون أي قيد", "لا يجوز توظيف أي جزء من الودائع إطلاقًا", "يجب توظيف الودائع بالكامل خارج سوريا فقط"], "a": 0, "legal": "ينبغي على الجمعية أن تراعي في توظيفها: أن يتم توظيفها في حدود لا تتجاوز ٥٠٪ على الأكثر من قيمتها، وألا تُستعمل لأغراض تتجاوز حدود ٧٠٪ من قيمتها، وألا تُستعمل لأغراض لا تتجاوز موعد استحقاقها.", "simple": "قيود مزدوجة تحمي الجمعية من مخاطر السيولة عند توظيف أموال الودائع المؤتمنة عليها.", "ex": "جمعية استهلاكية قبلت وديعة من أحد الأعضاء لا يجوز أن توظف أكثر من نصف قيمتها في مشاريع طويلة الأمد، حفاظًا على قدرتها على ردها عند الطلب.", "trap": "رقما ٥٠٪ و٧٠٪ متقاربان ويسهل الخلط بينهما — الأول (٥٠٪) هو سقف التوظيف العام، والثاني (٧٠٪) سقف مرتبط بغرض استخدام محدد؛ راجع الفرق الدقيق بينهما جيدًا."}, {"q": "لماذا لا يجوز للجمعية أن تطالب العضو المتغيب عن حضور اجتماعات الهيئة العامة بفوائد العائد المستحقة له؟", "opts": ["لأن النظام الداخلي قد ينص على سقوط حق العائد بالغياب لكن هذا لا يمنع العضو من المطالبة بأسهمه، والمبالغ التي تسقط الحق بالمطالبة بها تعود قيمتها وفوائدها للعائد للجمعية", "لأن الغياب يُسقط عضوية الشخص بالكامل تلقائيًا", "لأن الجمعية ملزمة بدفع فوائد الغياب مضاعفة", "لا علاقة للغياب بأي حق مالي للعضو مطلقًا"], "a": 0, "legal": "إذا نص النظام الداخلي للجمعية على سقوط حق العضو في العائد إذا كان متغيبًا عن حضور اجتماعات الهيئة العامة، فإن المبالغ التي يسقط الحق بالمطالبة بها تعود قيمتها وفوائدها للجمعية، ولا يمكن للعضو المطالبة بعائده بحقوقه لاعتبارات دينية.", "simple": "نص نادر يربط بين المشاركة الفعلية في الجمعية (حضور الاجتماعات) وبين استحقاق بعض الحقوق المالية، وفق ما ينص عليه النظام الداخلي تحديدًا.", "ex": "عضو تغيب مرارًا عن اجتماعات جمعية استهلاكية بالقامشلي قد يفقد حقه بالمطالبة بعائد سنوات غيابه إذا نص نظامها الداخلي على ذلك صراحة.", "trap": "هذا الحكم مشروط بوجود نص صريح في النظام الداخلي للجمعية — ليس قاعدة عامة تلقائية تطبَّق في كل الجمعيات دون استثناء."}, {"q": "ما هي المصادر المتنوعة لتمويل الجمعية التعاونية السكنية؟", "opts": ["رأس المال، الهبات والوصايا، القروض من المصارف العامة، اشتراكات جمعيات المغتربين بالعملات الأجنبية", "الضرائب الحكومية المباشرة فقط", "التبرعات الشخصية من أعضاء مجلس الإدارة فقط", "بيع الأراضي الزراعية فقط"], "a": 0, "legal": "من المصادر المتنوعة للجمعية السكنية: أولاً رأس المال (١٠٪ من الفائض)، ثانيًا الهبات والوصايا غير المخصصة لغرض معين ويشترط لقبولها اقتراح الاتحاد العام وموافقة رئيس مجلس الوزراء والوزير، ثالثًا القروض التي تحصل عليها من المصارف العامة، رابعًا مدفوعات واشتراكات الأعضاء المنتسبين إلى جمعيات المغتربين بالعملات الأجنبية.", "simple": "تمويل السكن التعاوني أوسع مصادر من الجمعية الاستهلاكية، ويشمل حتى مساهمات من مغتربين سوريين بالخارج.", "ex": "مغترب سوري من أصل القامشلي مقيم بالخارج يمكنه المساهمة في تمويل جمعية سكنية تعاونية عبر اشتراك بالعملة الأجنبية.", "trap": "لاحظ الشرط الخاص بالهبات: تحتاج موافقة مزدوجة (اقتراح الاتحاد العام + موافقة رئيس مجلس الوزراء والوزير) وليس قرارًا داخليًا بسيطًا من الجمعية وحدها."}, {"q": "كيف تُوزَّع أرباح الجمعية التعاونية السكنية وفق النسب المحددة في النوطة؟", "opts": ["١٠٪ للاحتياطي القانوني، ٣٪ للاتحاد العام، ٧٪ للاتحاد، ٥٥٪ للتدريب والتثقيف، والباقي لتعويضات ومكافآت وصندوق التكافل", "تُوزَّع بالكامل على الأعضاء دون أي اقتطاعات", "تذهب بال function showTab(name){
  document.getElementById('study').classList.toggle('active', name==='study');
  document.getElementById('quiz').classList.toggle('active', name==='quiz');
  document.getElementById('tab-study').classList.toggle('active', name==='study');
  document.getElementById('tab-quiz').classList.toggle('active', name==='quiz');
}

// ===== Render study units =====
function renderStudy(){
  const container = document.getElementById('study');
  let html = '';
  DATA.units.forEach(u=>{
    html += `<div class="unit"><h3>${u.title}</h3><ul>`;
    u.points.forEach(p=> html += `<li>${p}</li>`);
    html += `</ul>`;
    html += `<div class="tag trap"><b>⚠️ فخ امتحاني:</b><span>${u.trap}</span></div>`;
    html += `<div class="tag example"><b>مثال سوري:</b><span>${u.example}</span></div>`;
    html += `</div>`;
  });
  container.innerHTML = html;
}

// ===== Quiz logic =====
let order = [];
let idx = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function initQuiz(){
  order = shuffle(DATA.quiz.map((_,i)=>i));
  idx = 0; score = 0; answered = false;
  updateScoreBadge();
  renderQuestion();
}

function updateScoreBadge(){
  document.getElementById('scoreNum').textContent = score;
}

function renderQuestion(){
  answered = false;
  const total = order.length;
  document.getElementById('qcount').textContent = `سؤال ${idx+1} من ${total}`;
  document.getElementById('progressBar').style.width = (idx/total*100)+'%';

  if(idx >= total){
    renderResult();
    return;
  }

  const qi = DATA.quiz[order[idx]];
  // shuffle options while tracking correct answer text
  const correctText = qi.opts[qi.a];
  const optsShuffled = shuffle(qi.opts.map((t,i)=>({t,orig:i})));

  let html = `<div class="qcard">
    <h4>${idx+1}. ${qi.q}</h4>
    <div id="optsWrap">`;
  optsShuffled.forEach(o=>{
    html += `<button class="opt" data-correct="${o.t===correctText}" onclick="selectOpt(this)">${o.t}</button>`;
  });
  html += `</div>
    <div class="cards4" id="cards4">
      <div class="minicard mc-legal"><span class="lbl">📜 النص القانوني</span>${qi.legal}</div>
      <div class="minicard mc-simple"><span class="lbl">💡 الشرح المبسط</span>${qi.simple}</div>
      <div class="minicard mc-example"><span class="lbl">مثال سوري</span>${qi.ex}</div>
      <div class="minicard mc-trap"><span class="lbl">⚠️ فخ الامتحان</span>${qi.trap}</div>
    </div>
    <button class="nextbtn" id="nextBtn" onclick="nextQuestion()">التالي ←</button>
  </div>`;

  document.getElementById('quizArea').innerHTML = html;
}

function selectOpt(btn){
  if(answered) return;
  answered = true;
  const wasCorrect = btn.getAttribute('data-correct') === 'true';
  const opts = document.querySelectorAll('#optsWrap .opt');
  opts.forEach(o=>{
    o.classList.add('disabled');
    if(o.getAttribute('data-correct')==='true'){
      o.classList.add('correct');
    } else if(o===btn){
      o.classList.add('wrong');
    } else {
      o.classList.add('dim');
    }
  });
  if(wasCorrect){ score++; updateScoreBadge(); }
  document.getElementById('cards4').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  idx++;
  renderQuestion();
}

function renderResult(){
  document.getElementById('progressBar').style.width = '100%';
  const total = order.length;
  const pct = Math.round(score/total*100);
  let msg = '';
  if(pct>=90) msg='ممتاز جدًا! مستوى يفتح باب النجاح بامتياز 🌟';
  else if(pct>=75) msg='جيد جدًا! راجع الفخوخ الامتحانية التي أخطأت فيها 💪';
  else if(pct>=50) msg='مستوى مقبول، يحتاج مراجعة أعمق للوحدات الضعيفة 📖';
  else msg='ابدأ بمراجعة قسم الشرح جيدًا قبل إعادة الاختبار 🔁';

  document.getElementById('quizArea').innerHTML = `
    <div class="result">
      <h2>🎉 انتهى الاختبار</h2>
      <div class="big">${score} / ${total}</div>
      <div>نسبة النجاح: <b>${pct}٪</b></div>
      <p>${msg}</p>
      <button class="restartbtn" onclick="initQuiz()">🔄 إعادة الاختبار (ترتيب عشوائي جديد)</button>
    </div>`;
}

renderStudy();
initQuiz();
</script>
